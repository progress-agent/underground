<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070b" />
    <meta name="description" content="Interactive 3D visualization of the London Underground network with depth data, Crossrail, Tideway Tunnel, and geological strata. Explore 248 stations across 11 tube lines." />
    <meta property="og:title" content="UnderGround — London Underground 3D Visualization" />
    <meta property="og:description" content="Interactive 3D map of the London Underground with real depth data. Explore tube lines, Crossrail, Tideway Tunnel, and geological layers." />
    <meta property="og:url" content="https://underground.dtdq.net/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="UnderGround — London Underground 3D Visualization" />
    <meta name="twitter:description" content="Interactive 3D map of the London Underground with real depth data. Explore tube lines, Crossrail, Tideway Tunnel, and geological layers." />
    <title>UnderGround — 248 stations across 11 lines + infrastructure</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <style>
      @font-face {
        font-family: 'Railway Sans';
        src: url('/fonts/Railway.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      html, body { height: 100%; margin: 0; }
      body { background: #05070b; overflow: hidden; font-family: 'Railway Sans', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      #app { position: fixed; inset: 0; }

      /* HTML overlay for station labels */
      #station-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      .station-label {
        position: absolute;
        left: 0;
        top: 0;
        transform: translate(-9999px, -9999px);
        padding: 2px 6px;
        border-radius: 999px;
        font-size: 11px;
        line-height: 1.2;
        color: rgba(255,255,255,0.92);
        background: rgba(8, 12, 18, 0.55);
        border: 1px solid rgba(255,255,255,0.12);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        white-space: nowrap;
        text-shadow: 0 1px 2px rgba(0,0,0,0.35);
      }

      .hud {
        position: fixed; left: 12px; top: 12px; z-index: 15; color: rgba(255,255,255,0.92);
        background: rgba(20, 24, 34, 0.45);
        border: 1px solid rgba(255,255,255,0.10);
        border-radius: 12px;
        padding: 10px 12px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        max-height: calc(100vh - 24px);
        overflow: auto;
        overscroll-behavior: contain;
      }
      .hud h1 { margin: 0 0 6px; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; }
      .hud p { margin: 0; font-size: 12px; opacity: 0.92; max-width: 380px; }
      .hud code { opacity: 0.95; }
      .hud .small { margin-top: 6px; font-size: 11px; opacity: 0.88; }

      .hud .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
      .hud button { touch-action: manipulation; }

      /* Mobile: collapse HUD into a small header with a Details toggle */
      @media (max-width: 520px) {
        .hud { left: 10px; top: 10px; right: 10px; width: auto; max-width: none; }
        .hud details > summary { cursor: pointer; user-select: none; list-style: none; }
        .hud details > summary::-webkit-details-marker { display: none; }
        .hud details > summary { display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .hud details > summary .title { font-weight: 700; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
        .hud details > summary .meta { opacity: 0.75; font-size: 11px; }
        .hud details[open] > summary { margin-bottom: 8px; }
      }

      /* Loading bar - centered on screen */
      #loadingBar {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 50;
        width: 280px;
        text-align: center;
      }
      #loadingBar .label {
        font-size: 12px;
        color: rgba(255,255,255,0.7);
        margin-bottom: 8px;
        letter-spacing: 0.05em;
      }
      #loadingBar .track {
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
        overflow: hidden;
      }
      #loadingBar .fill {
        height: 100%;
        background: linear-gradient(90deg, #4ade80, #22c55e);
        width: 0%;
        transition: width 0.2s ease-out;
        border-radius: 2px;
      }
      #loadingBar.done {
        opacity: 0;
        transition: opacity 0.4s ease-out;
        pointer-events: none;
      }

      .net-status {
        position: fixed;
        right: 12px;
        top: 12px;
        z-index: 20;
        font-size: 12px;
        color: rgba(255,255,255,0.88);
        background: rgba(20, 24, 34, 0.35);
        border: 1px solid rgba(255,255,255,0.10);
        border-radius: 999px;
        padding: 6px 10px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .net-status b { font-weight: 600; }
      .net-status.ok { border-color: rgba(34, 197, 94, 0.25); }
      .net-status.warn { border-color: rgba(245, 158, 11, 0.25); }
      .net-status.err { border-color: rgba(239, 68, 68, 0.25); }

      .hover-tip {
        position: fixed;
        z-index: 25;
        pointer-events: none;
        font-size: 12px;
        color: rgba(255,255,255,0.90);
        background: rgba(14, 17, 25, 0.92);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;
        padding: 6px 8px;
        transform: translate(-9999px, -9999px);
      }
      .hover-tip b { font-weight: 600; }
      .hover-tip .muted { opacity: 0.75; }
      .hover-tip .sub {
        font: 10.5px 'IBM Plex Mono', ui-monospace, monospace;
        color: rgba(255,255,255,0.78);
        margin-top: 1px;
        margin-bottom: 3px;
      }
      .hover-tip table {
        font: 9.5px 'IBM Plex Mono', ui-monospace, monospace;
        border-collapse: collapse;
        margin-top: 2px;
      }
      .hover-tip th {
        color: rgba(255,255,255,0.55);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 1px 12px 1px 0;
        text-align: left;
        font-weight: 400;
      }
      .hover-tip td {
        color: rgba(255,255,255,0.92);
        text-align: right;
        padding: 1px 0;
        font-variant-numeric: tabular-nums;
      }

      /* Compass + altimeter replaced by src/readout.js (#ug-readout) */
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loadingBar">
      <div class="label">Loading London Underground…</div>
      <div class="track"><div class="fill" id="loadingFill"></div></div>
    </div>
    <div id="netStatus" class="net-status" style="display:none"></div>
    <div id="hoverTip" class="hover-tip" style="display:none"></div>

    <div id="hud" class="hud">
      <details id="hudDetails">
        <summary>
          <span class="title">Under Ground <span style="font-size:9px;opacity:0.6">v250206a</span></span>
          <span class="meta">
            <span id="simStatus" style="opacity:0.78;">Running</span>
            <span style="opacity:0.55;">•</span>
            <span id="focusStatus" style="opacity:0.75;">Focus: all</span>
          </span>
        </summary>

        <p class="small row">
          <label style="display:flex; gap:6px; align-items:center; user-select:none;">
            <input id="victoriaStations" type="checkbox" checked />
            <span>Station markers</span>
          </label>
          <label style="display:flex; gap:6px; align-items:center; user-select:none;">
            <input id="victoriaLabels" type="checkbox" checked />
            <span>Labels</span>
          </label>
          <label style="display:flex; gap:6px; align-items:center; user-select:none;">
            <input id="victoriaShafts" type="checkbox" checked />
            <span>Shafts</span>
          </label>
        </p>

        <p class="small" style="margin-top:8px;">
          Solo line:
          <select id="soloLine" style="font-size:11px; padding:2px 6px; border-radius:6px; border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.9); cursor:pointer;">
            <option value="all">All lines</option>
          </select>
        </p>

        <p class="small row">
          <button id="togglePause" type="button" style="font-size:11px; padding:3px 10px; border-radius:999px; border:1px solid rgba(255,255,255,0.14); background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.88); cursor:pointer;">Pause</button>
          <button id="focusAll" type="button" style="font-size:11px; padding:3px 10px; border-radius:999px; border:1px solid rgba(255,255,255,0.14); background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.88); cursor:pointer;">Focus all</button>
          <button id="copyLink" type="button" style="font-size:11px; padding:3px 10px; border-radius:999px; border:1px solid rgba(255,255,255,0.14); background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.88); cursor:pointer;">Copy link</button>
          <span style="opacity:0.7;">(Space to toggle)</span>
        </p>

        <p class="small">
          Time scale:
          <input id="timeScale" type="range" min="0.5" max="30" value="8" step="0.5" style="vertical-align: middle; width: 160px;" />
          <span id="timeScaleValue">8×</span>
        </p>
        <p class="small">
          Focal length:
          <input id="focalLength" type="range" min="12" max="200" value="30" step="1"
                 style="vertical-align: middle; width: 160px;" />
          <span id="focalLengthValue">30mm</span>
        </p>

        <p class="small row">
          <button id="flightSprint" type="button" aria-pressed="false" style="font-size:11px; padding:3px 10px; border-radius:999px; border:1px solid rgba(255,255,255,0.14); background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.88); cursor:pointer;">Fast flight: off</button>
          <span style="opacity:0.7;">3× movement (Shift)</span>
        </p>

        <p class="small" style="display:flex; gap:8px; align-items:center;">
          Volume:
          <input id="audioVolume" type="range" min="0" max="100" value="60" step="1"
                 style="vertical-align: middle; width: 100px;" />
          <span id="audioVolumeValue" style="min-width:28px;">60%</span>
          <button id="audioMute" type="button" style="font-size:11px; padding:3px 8px; border-radius:999px; border:1px solid rgba(255,255,255,0.14); background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.88); cursor:pointer;">Mute</button>
        </p>

        <p class="small row">
          <button id="resetPrefs" type="button" style="font-size:11px; padding:3px 10px; border-radius:999px; border:1px solid rgba(255,255,255,0.14); background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.88); cursor:pointer;">Reset settings</button>
          <span style="opacity:0.7;">Clears saved prefs + TfL cache.</span>
        </p>
      </details>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
